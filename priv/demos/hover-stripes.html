<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hover stripes</title>
<style>
  @font-face {
    font-family: "Bricolage Demo";
    font-weight: 200 800;
    src: url(/fonts/BricolageGrotesque/BricolageGrotesque-700.woff2) format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #e8e8e8; color: #111114; font-family: "Bricolage Demo", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; justify-items: center; min-height: 100dvh; }
  form { display: flex; gap: 8px; justify-content: center; padding: 16px 16px 0; }
  button { padding: 10px 14px; border-radius: 999px; border: 1px solid #11111440; background: none; color: #111114c0; font: 600 12px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  button[aria-pressed="true"] { background: #111114; color: #fff; border-color: #111114; }
  button:focus-visible { outline: 2px solid #111114; outline-offset: 3px; }
  .cards { align-self: center; display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; padding: 20px 16px 32px; width: 100%; }
  .card { width: min(100%, 340px, calc((100dvh - 140px) * 0.565)); aspect-ratio: 0.565; border-radius: 8px; overflow: hidden; background: #fff; container-type: inline-size; display: flex; flex-direction: column; }
  .card.flip { flex-direction: column-reverse; }
  .text { padding: 7cqw 6.5cqw 7.5cqw; }
  .text small { display: block; font-size: 3.7cqw; font-weight: 800; letter-spacing: 0.02em; text-transform: uppercase; }
  .text h2 { margin: 4cqw 0 0; font-size: 6cqw; font-weight: 500; letter-spacing: -0.02em; }
  .text p { margin: 3.5cqw 0 0; font-size: 3.6cqw; font-weight: 400; color: #6b6b70; }
  canvas { flex: 1; min-height: 0; width: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
  <form id="controls">
    <div id="palettes" role="group" aria-label="Palette" style="display: flex; gap: 8px"></div>
  </form>
  <div class="cards">
    <article class="card">
      <div class="text">
        <small>Wrapped 2026</small>
        <h2>Tuned to your year.</h2>
        <p>Patterns that react when you hover.</p>
      </div>
      <canvas data-tone="light" aria-hidden="true"></canvas>
    </article>
    <article class="card flip">
      <div class="text">
        <small>Wrapped 2026</small>
        <h2>Tuned to your year.</h2>
        <p>Patterns that react when you hover.</p>
      </div>
      <canvas data-tone="dark" aria-hidden="true"></canvas>
    </article>
  </div>

<script>
const PALETTES = {
  Lilac: { soft: "#d4b8fb", deep: "#17112e" },
  Lime: { soft: "#d6f26a", deep: "#12210f" },
  Coral: { soft: "#ffb39e", deep: "#2a0f14" },
};
const LINES = 10;
const STEPS = 56;

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const state = { palette: PALETTES[query.get("palette")] ? query.get("palette") : "Lilac", clock: 0, last: 0, touched: -10 };

// One striped panel. Each line is drawn as a closed shape whose width swells
// near a focus point, which chases the pointer with a little lag.
function panel(canvas, index) {
  const ctx = canvas.getContext("2d");
  const p = { x: 0.5, y: 0.5, strength: 0, targetX: 0.5, targetY: 0.5, target: 0 };

  canvas.addEventListener("pointermove", (e) => {
    const box = canvas.getBoundingClientRect();
    p.targetX = (e.clientX - box.left) / box.width;
    p.targetY = (e.clientY - box.top) / box.height;
    p.target = 1;
    p.hover = true;
    state.touched = state.clock;
  });
  const leave = () => { p.target = 0; p.hover = false; };
  canvas.addEventListener("pointerleave", leave);
  canvas.addEventListener("pointercancel", leave);

  return (dt, frozen) => {
    // With nobody hovering, a focus point wanders from one panel to the other.
    if (!p.hover && !reduced && state.clock - state.touched > 2) {
      const cycle = (state.clock * 0.28 + index * 0.5) % 1;
      p.target = Math.max(0, Math.sin(cycle * Math.PI * 2)) ** 0.6;
      p.targetX = 0.5 + 0.42 * Math.sin(state.clock * 0.9 + index * 2.1);
      p.targetY = 0.5 + 0.48 * Math.sin(state.clock * 0.57 + index * 1.3);
    }
    // While another panel is being hovered, this one settles back to plain lines.
    if (!p.hover && state.clock - state.touched <= 2) p.target = 0;
    if (frozen) Object.assign(p, { x: frozen.x, y: frozen.y, strength: frozen.strength });
    else {
      const k = Math.min(1, dt * 7);
      p.x += (p.targetX - p.x) * k;
      p.y += (p.targetY - p.y) * k;
      p.strength += (p.target - p.strength) * Math.min(1, dt * 4);
    }

    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(canvas.clientWidth * ratio));
    const h = Math.max(2, Math.round(canvas.clientHeight * ratio));
    if (w !== canvas.width || h !== canvas.height) { canvas.width = w; canvas.height = h; }

    const colors = PALETTES[state.palette];
    const light = canvas.dataset.tone === "light";
    ctx.fillStyle = light ? colors.soft : colors.deep;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = light ? colors.deep : colors.soft;

    const pitch = w / LINES;
    const thin = Math.max(1, w * 0.0042);
    for (let i = 0; i < LINES; i++) {
      const x = (i + 0.58) * pitch;
      const dx = (x / w - p.x) / 0.5;
      const across = 0.5 + 0.5 * Math.exp(-dx * dx);
      const half = (y) => {
        const dy = (y / h - p.y) / 0.3;
        return thin + p.strength * pitch * 0.47 * across * Math.exp(-dy * dy);
      };
      ctx.beginPath();
      for (let s = 0; s <= STEPS; s++) {
        const y = (s / STEPS) * h;
        ctx.lineTo(x - half(y), y);
      }
      for (let s = STEPS; s >= 0; s--) {
        const y = (s / STEPS) * h;
        ctx.lineTo(x + half(y), y);
      }
      ctx.closePath();
      ctx.fill();
    }
  };
}

const panels = [...document.querySelectorAll("canvas")].map(panel);
const frozen = query.has("x") ? { x: Number(query.get("x")), y: Number(query.get("y") ?? 0.5), strength: Number(query.get("strength") ?? 1) } : null;

function frame(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000 || 0);
  state.last = now;
  state.clock += dt;
  for (const draw of panels) draw(dt, frozen);
  requestAnimationFrame(frame);
}

const palettes = document.getElementById("palettes");
for (const name of Object.keys(PALETTES)) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  b.setAttribute("aria-pressed", String(name === state.palette));
  b.addEventListener("click", () => {
    state.palette = name;
    for (const other of palettes.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === b));
  });
  palettes.append(b);
}
document.getElementById("controls").addEventListener("submit", (e) => e.preventDefault());
requestAnimationFrame(frame);
</script>
</body>
</html>
