<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Heat card</title>
<style>
  @font-face {
    font-family: "Bricolage Demo";
    font-weight: 200 800;
    src: url(/fonts/BricolageGrotesque/BricolageGrotesque-700.woff2) format("woff2");
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #e0e0e0; color: #111114; font-family: "Bricolage Demo", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; justify-items: center; min-height: 100dvh; }
  form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px 16px 0; }
  button, .file { padding: 10px 14px; border-radius: 999px; border: 1px solid #11111440; background: none; color: #111114c0; font: 600 12px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  button[aria-pressed="true"] { background: #111114; color: #fff; border-color: #111114; }
  button:focus-visible, .file:focus-within { outline: 2px solid #111114; outline-offset: 3px; }
  .file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .card { align-self: center; position: relative; width: min(calc(100% - 32px), 480px, calc((100dvh - 130px) * 0.75)); aspect-ratio: 0.75; margin: 16px 0 32px; container-type: inline-size; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .label { position: absolute; left: 7cqw; right: 7cqw; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: space-between; color: #fff; pointer-events: none; }
  .label svg { width: 27cqw; height: auto; display: block; }
  .label span { pointer-events: auto; font-size: 9.2cqw; font-weight: 500; letter-spacing: -0.02em; outline: none; min-width: 1ch; }
  .error { align-self: center; padding: 24px; text-align: center; color: #111114b0; }
</style>
</head>
<body>
  <form id="controls">
    <div id="palettes" role="group" aria-label="Palette" style="display: flex; gap: 8px"></div>
    <label class="file">Your picture<input type="file" id="file" accept="image/*"></label>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
  </form>
  <div class="card" id="card">
    <canvas id="gl" role="img" aria-label="A rounded card filled with a heavily blurred moving picture, recoloured in neon green, pink and orange."></canvas>
    <div class="label">
      <svg viewBox="0 0 108 80" fill="currentColor" aria-hidden="true">
        <rect x="0" y="30" width="22" height="50" rx="8"/>
        <rect x="28" y="0" width="22" height="80" rx="8"/>
        <rect x="56" y="18" width="22" height="62" rx="8"/>
        <rect x="84" y="42" width="22" height="38" rx="8"/>
      </svg>
      <span id="word" contenteditable="plaintext-only" spellcheck="false" aria-label="Card text">listen</span>
    </div>
  </div>

<script>
// Five colours per palette, from the darkest part of the picture to the lightest.
const PALETTES = {
  Neon: ["#0c1a3c", "#c0202c", "#ff8f14", "#ff62cc", "#dcd6cf", "#86ff7e"],
  Deep: ["#060b1c", "#3a1c8c", "#1f6bff", "#31d8e8", "#d6e2e0", "#f2ff6a"],
  Dusk: ["#1a0a26", "#7a1466", "#ff4a4a", "#ffa63d", "#e8dccb", "#b9a4ff"],
};
const CELLS = 20;

const VERT = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// A moving picture is read on a very coarse grid and smoothed between the grid
// points, so it turns into soft blocks. Only its brightness is kept, and that
// brightness picks a colour from the palette. Near the border of the card the
// brightness is pushed up, which gives the glowing coloured rim. The picture
// is either drawn here (drifting shapes) or an uploaded image that pans slowly.
const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float uTime;
uniform float uCells;
uniform vec3 uColors[6];
uniform vec3 uPage;
uniform sampler2D uImage;
uniform float uUseImage;
uniform float uLod;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float soft(vec2 p) { return noise(p) * 0.68 + noise(p * 1.93 + 5.1) * 0.32; }

// A slab with straight edges that turns and slides, like an object in a film.
float slab(vec2 p, vec2 centre, float angle, float halfWidth) {
  float d = dot(p - centre, vec2(cos(angle), sin(angle)));
  return smoothstep(halfWidth + 0.07, halfWidth - 0.07, abs(d));
}

float drawn(vec2 uv, float t) {
  vec2 p = (uv - 0.5) * vec2(1.5, 2.0);
  vec2 q = p + 0.45 * (vec2(soft(p * 0.9 + vec2(t * 0.11, 0.0)), soft(p * 0.9 + vec2(5.0, -t * 0.09))) - 0.5);
  float v = 0.3 + 0.66 * smoothstep(0.22, 0.78, soft(q * 1.1 + vec2(t * 0.08, 3.0)));
  v = mix(v, 0.3, 0.6 * slab(q, vec2(0.3 * sin(t * 0.23), 0.35 * cos(t * 0.19)), 0.5 + 0.6 * sin(t * 0.13), 0.1));
  v = mix(v, 0.03, 0.9 * slab(q, vec2(0.45 * cos(t * 0.17 + 1.0), 0.3 * sin(t * 0.21 + 2.0)), -0.7 + 0.5 * sin(t * 0.11 + 1.0), 0.17) * smoothstep(0.36, 0.62, soft(q * 0.7 + vec2(9.0, t * 0.06))));
  v = mix(v, 0.74, 0.8 * slab(q, vec2(0.4 * sin(t * 0.15 + 4.0), 0.55 * sin(t * 0.12)), 0.2 * sin(t * 0.2), 0.13));
  return v;
}

float value(vec2 uv, float t) {
  if (uUseImage < 0.5) return drawn(uv, t);
  vec2 at = 0.5 + (uv - 0.5) * (0.62 + 0.08 * sin(t * 0.21)) + 0.14 * vec2(sin(t * 0.17), cos(t * 0.13));
  float l = dot(textureLod(uImage, at, uLod).rgb, vec3(0.3, 0.59, 0.11));
  return smoothstep(0.08, 0.92, l);
}

vec3 ramp(float v) {
  v = clamp(v, 0.0, 1.0) * 5.0;
  vec3 c = uColors[0];
  for (int i = 0; i < 5; i++) c = mix(c, uColors[i + 1], smoothstep(0.0, 1.0, clamp(v - float(i), 0.0, 1.0)));
  return c;
}

void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  float t = uTime;

  // Coarse grid, smoothed between its points.
  vec2 grid = vec2(uCells, uCells * uRes.y / uRes.x);
  vec2 g = uv * grid - 0.5;
  vec2 i = floor(g), f = fract(g);
  f = mix(f, f * f * (3.0 - 2.0 * f), 0.7);
  float v = mix(
    mix(value((i + vec2(0.5, 0.5)) / grid, t), value((i + vec2(1.5, 0.5)) / grid, t), f.x),
    mix(value((i + vec2(0.5, 1.5)) / grid, t), value((i + vec2(1.5, 1.5)) / grid, t), f.x), f.y);

  // The card is a rounded shape with bulging sides. shape is 0 at the centre
  // and 1 on the border.
  vec2 s = abs(uv - 0.5) * 2.0;
  float shape = pow(pow(s.x, 3.4) + pow(s.y, 3.4), 1.0 / 3.4);
  float rim = smoothstep(0.45, 1.0, shape);
  v += rim * rim * (1.0 - v) * 0.5;
  // On the rim the pale tone is skipped, so the border stays vivid.
  v = mix(v, min(v, 0.62) + 0.38 * smoothstep(0.62, 0.8, v), rim);

  vec3 col = ramp(v);
  col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.025;
  float inside = 1.0 - smoothstep(-1.0, 1.0, (shape - 0.985) / fwidth(shape));
  outColor = vec4(mix(uPage, col, inside), 1.0);
}`;

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const state = {
  palette: PALETTES[query.get("palette")] ? query.get("palette") : "Neon",
  paused: reduced,
  frozen: query.has("time") ? Number(query.get("time")) : null,
  clock: 3,
  last: 0,
  image: null,
};
let uniforms = {};
let texture = null;

function fail(message) {
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = message;
  document.getElementById("card").replaceWith(p);
}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

// The uploaded picture is cropped to a 512 square. The shader only ever reads
// a very blurred copy of it.
function upload() {
  if (!state.image) return;
  const size = 512;
  const square = document.createElement("canvas");
  square.width = square.height = size;
  const ctx = square.getContext("2d");
  const scale = Math.max(size / state.image.width, size / state.image.height);
  const w = state.image.width * scale, h = state.image.height * scale;
  ctx.drawImage(state.image, (size - w) / 2, (size - h) / 2, w, h);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, square);
  gl.generateMipmap(gl.TEXTURE_2D);
}

function setup() {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "position");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  for (const name of ["uRes", "uTime", "uCells", "uColors", "uPage", "uImage", "uUseImage", "uLod"]) uniforms[name] = gl.getUniformLocation(program, name);
  texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([128, 128, 128, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.MIRRORED_REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.MIRRORED_REPEAT);
  upload();
}

function frame(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000 || 0);
  state.last = now;
  if (!gl.isContextLost()) {
    if (!state.paused) state.clock += dt;
    const ratio = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.max(2, Math.round(canvas.clientWidth * ratio));
    const h = Math.max(2, Math.round(canvas.clientHeight * ratio));
    if (w !== canvas.width || h !== canvas.height) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    gl.uniform2f(uniforms.uRes, w, h);
    gl.uniform1f(uniforms.uTime, state.frozen ?? state.clock);
    gl.uniform1f(uniforms.uCells, CELLS);
    gl.uniform3fv(uniforms.uColors, PALETTES[state.palette].flatMap(rgb));
    gl.uniform3fv(uniforms.uPage, rgb("#e0e0e0"));
    gl.uniform1i(uniforms.uImage, 0);
    gl.uniform1f(uniforms.uUseImage, state.image ? 1 : 0);
    gl.uniform1f(uniforms.uLod, Math.log2(512 / CELLS) - 0.6);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);
}

function start() {
  if (!gl) return fail("WebGL 2 is not available in this browser.");
  canvas.addEventListener("webglcontextlost", (e) => e.preventDefault());
  canvas.addEventListener("webglcontextrestored", () => setup());
  try {
    setup();
  } catch (error) {
    if (!gl.isContextLost()) return fail(String(error.message || error));
  }
  const palettes = document.getElementById("palettes");
  for (const name of Object.keys(PALETTES)) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(name === state.palette));
    b.addEventListener("click", () => {
      state.palette = name;
      for (const other of palettes.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === b));
    });
    palettes.append(b);
  }
  // The picture is read in the browser and never leaves it.
  document.getElementById("file").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const image = new Image();
      image.onload = () => { state.image = image; if (!gl.isContextLost()) upload(); };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  const pause = document.getElementById("pause");
  pause.setAttribute("aria-pressed", String(state.paused));
  pause.addEventListener("click", () => {
    state.paused = !state.paused;
    pause.setAttribute("aria-pressed", String(state.paused));
  });
  if (query.get("text")) document.getElementById("word").textContent = query.get("text");
  document.getElementById("controls").addEventListener("submit", (e) => e.preventDefault());
  requestAnimationFrame(frame);
}

start();
</script>
</body>
</html>
