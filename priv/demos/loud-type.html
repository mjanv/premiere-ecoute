<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loud type</title>
<style>
  @font-face {
    font-family: "Bricolage Demo";
    font-weight: 200 800;
    src: url(/fonts/BricolageGrotesque/BricolageGrotesque-700.woff2) format("woff2");
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #050505; color: #fff; font-family: "Bricolage Demo", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; justify-items: center; min-height: 100dvh; }
  form { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 16px 16px 0; }
  input[type="text"] { width: min(240px, 60vw); padding: 10px 14px; border-radius: 999px; border: 1px solid #ffffff40; background: #ffffff10; color: #fff; font: 600 14px/1 inherit; letter-spacing: 0.06em; text-transform: uppercase; }
  button { padding: 10px 14px; border-radius: 999px; border: 1px solid #ffffff40; background: none; color: #ffffffc0; font: 600 12px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  button[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }
  button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  canvas { align-self: center; margin: 20px 16px 28px; height: min(calc(100dvh - 120px), calc((100vw - 32px) * 1.25)); aspect-ratio: 4 / 5; display: block; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
  <form id="controls">
    <input id="text" type="text" maxlength="30" aria-label="Three words" value="PLAY IT LOUD">
    <button type="button" id="pause" aria-pressed="false">Pause</button>
  </form>
  <canvas id="stage" width="800" height="1000" aria-hidden="true"></canvas>
  <p class="sr" id="live" aria-live="polite"></p>

<script>
const W = 800, H = 1000;
const FPS = 12;          // drawn on twelves, like stop motion
const LOOP = 64;         // frames per loop
const COLORS = ["#ff1fe0", "#ff5a0a", "#ff1f55"];
const DARK = "#1c0012";
const FONT = '800 300px "Bricolage Demo", "Arial Narrow", Impact, sans-serif';
const SQUEEZE = 0.58;    // horizontal squeeze that makes the type condensed
const LEADING = 0.76;

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");
const input = document.getElementById("text");

function rand(a, b = 0) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}

let lines = [];
function setText(value) {
  const words = value.toUpperCase().trim().split(/\s+/).filter(Boolean);
  lines = words.length ? words.slice(0, 3) : ["LOUD"];
  ctx.font = FONT;
  const widest = Math.max(...lines.map((line) => ctx.measureText(line).width * SQUEEZE));
  // At scale 1 the block fills the width or the height, whichever comes first.
  setText.fit = Math.min((W * 0.96) / widest, (H * 0.92) / (lines.length * 300 * LEADING));
  document.getElementById("live").textContent = lines.join(" ");
}

// Dust on the black background, drawn once.
const dust = (() => {
  const c = document.createElement("canvas");
  c.width = W;
  c.height = H;
  const d = c.getContext("2d");
  for (let i = 0; i < 1400; i++) {
    d.fillStyle = `rgba(255,255,255,${0.04 + rand(i, 1) * 0.14})`;
    const s = 1 + rand(i, 2) * 1.6;
    d.fillRect(rand(i, 3) * W, rand(i, 4) * H, s, s);
  }
  return c;
})();

// One word, drawn several times with tiny offsets so its edges look printed
// and rough. The offsets change every frame, which makes the edges boil.
function word(text, x, y, size, color, frame, index) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate((rand(frame, index + 40) - 0.5) * 0.05);
  ctx.transform(1, 0, -0.1, 1, 0, 0);
  ctx.scale((size / 300) * SQUEEZE, size / 300);
  ctx.font = FONT;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  for (let k = 0; k < 5; k++) {
    ctx.fillText(text, (rand(frame, k + index * 7) - 0.5) * 9, (rand(frame, k + index * 7 + 3) - 0.5) * 9);
  }
  ctx.restore();
}

function palette(frame) {
  const shift = Math.floor(frame / 2) % 3;
  const flip = Math.floor(frame / 6) % 2;
  const order = flip ? [0, 2, 1] : [0, 1, 2];
  return order.map((i) => COLORS[(i + shift) % 3]);
}

// The words stacked in the centre at a given scale (1 = full size).
function stack(scale, frame) {
  const size = 300 * setText.fit * scale;
  const colors = palette(frame);
  const jx = (rand(frame, 9) - 0.5) * 14 * scale, jy = (rand(frame, 10) - 0.5) * 14 * scale;
  lines.forEach((line, i) => {
    const y = H / 2 + (i - (lines.length - 1) / 2) * size * LEADING + jy;
    const x = W / 2 + jx + (rand(frame, 20 + i) - 0.5) * size * 0.1;
    // A second ink printed slightly off register underneath.
    ctx.globalAlpha = 0.6;
    word(line, x + size * 0.035, y + size * 0.028, size, colors[(i + 1) % 3], frame + 1, i);
    ctx.globalAlpha = 1;
    word(line, x, y, size, colors[i % 3], frame, i);
  });
}

// Full-bleed colour bands with dark words sliding sideways inside them.
function bands(scale, frame, slide, box) {
  const size = 300 * setText.fit * scale;
  const colors = palette(Math.floor(frame / 4) * 2);
  const band = size * LEADING;
  ctx.save();
  if (box) {
    ctx.beginPath();
    ctx.rect(box.x, box.y, box.w, box.h);
    ctx.clip();
  }
  lines.forEach((line, i) => {
    const y = H / 2 + (i - (lines.length - 1) / 2) * band;
    ctx.fillStyle = colors[i % 3];
    ctx.fillRect(0, y - band / 2 - 1, W, band + 2);
    ctx.font = FONT;
    const width = ctx.measureText(line).width * SQUEEZE * (size / 300) + size * 0.25;
    const direction = i % 2 ? -1 : 1;
    const offset = ((slide * direction * W * 0.9) % width + width) % width;
    for (let x = W / 2 - width * 2 + offset; x < W + width; x += width) {
      if (x > -width) word(line, x, y, size, DARK, frame, i);
    }
  });
  ctx.restore();
}

// Hand-drawn white marks. Each is redrawn slightly differently every frame.
// While a frame is being built, marks are held back and drawn after the
// grime pass, so they stay crisp like chalk on top of a dirty print.
let held = null;
function stroke(points) {
  if (held) return void held.push(points);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 4.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.stroke();
}

const DOODLES = {
  sparks(frame, radius) {
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * 0.95 + (i / 8) * Math.PI * 0.9 + (rand(frame, i) - 0.5) * 0.2;
      const r0 = radius * (1.05 + rand(frame, i + 30) * 0.15), r1 = r0 + radius * (0.12 + rand(frame, i + 60) * 0.14);
      stroke([[W / 2 + Math.cos(a) * r0, H / 2 + Math.sin(a) * r0 * 0.8], [W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1 * 0.8]]);
    }
  },
  squiggle(frame, x, y, length, height) {
    const points = [];
    for (let i = 0; i <= 26; i++) {
      const p = i / 26;
      points.push([x + p * length, y + Math.sin(p * 17 + frame) * height * (0.4 + rand(frame, i) * 0.7) + (rand(frame, i + 50) - 0.5) * 6]);
    }
    stroke(points);
  },
  arrow(frame, x, y, angle, length) {
    const wobble = (rand(frame, x) - 0.5) * 0.12;
    const a = angle + wobble;
    const ex = x + Math.cos(a) * length, ey = y + Math.sin(a) * length;
    stroke([[x, y], [ex, ey]]);
    stroke([[ex + Math.cos(a + 2.5) * 14, ey + Math.sin(a + 2.5) * 14], [ex, ey], [ex + Math.cos(a - 2.5) * 14, ey + Math.sin(a - 2.5) * 14]]);
  },
};

// --- Grime: a bad photocopy of the clean frame ------------------------------------

// The frame is copied at low resolution and every pixel is re-read from a
// slightly wrong place (ragged edges), darkened in blotches (starved ink),
// speckled, and whole rows are knocked sideways (paper slipping).
const LW = 400, LH = 500;
const low = document.createElement("canvas");
low.width = LW;
low.height = LH;
const lctx = low.getContext("2d", { willReadFrequently: true });
const COUNT = LW * LH;
const jitterX = new Int8Array(COUNT), jitterY = new Int8Array(COUNT);
const grainMap = new Float32Array(COUNT), blotch = new Float32Array(COUNT), holes = new Uint8Array(COUNT);
(() => {
  const soft = (x, y, cell, seed) => {
    const gx = x / cell, gy = y / cell, ix = Math.floor(gx), iy = Math.floor(gy);
    const fx = gx - ix, fy = gy - iy;
    const a = rand(ix + seed, iy), b = rand(ix + 1 + seed, iy), c = rand(ix + seed, iy + 1), d = rand(ix + 1 + seed, iy + 1);
    return (a + (b - a) * fx) * (1 - fy) + (c + (d - c) * fx) * fy;
  };
  for (let y = 0; y < LH; y++) {
    for (let x = 0; x < LW; x++) {
      const i = y * LW + x;
      const cx = Math.floor(x / 2), cy = Math.floor(y / 2);
      jitterX[i] = Math.round((rand(cx + 3, cy) - 0.5) * 5.5);
      jitterY[i] = Math.round((rand(cx, cy + 71) - 0.5) * 5.5);
      grainMap[i] = 0.72 + Math.random() * 0.42;
      blotch[i] = soft(x, y, 46, 5) * 0.65 + soft(x, y, 13, 90) * 0.35;
      holes[i] = soft(x, y, 5, 300) * 0.6 + Math.random() * 0.4 > 0.8 ? 1 : 0;
    }
  }
})();

function grime(frame) {
  lctx.imageSmoothingEnabled = true;
  lctx.drawImage(canvas, 0, 0, LW, LH);
  const image = lctx.getImageData(0, 0, LW, LH);
  const out = image.data;
  const src = new Uint8ClampedArray(out);
  const boil = Math.floor(rand(frame, 77) * COUNT);
  const drift = Math.floor(rand(Math.floor(frame / 3), 78) * COUNT);
  // Three bands of rows slip sideways on every frame.
  const slips = [0, 1, 2].map((k) => ({ from: Math.floor(rand(frame, 80 + k) * LH), size: 4 + Math.floor(rand(frame, 84 + k) * 30), by: Math.round((rand(frame, 88 + k) - 0.5) * 46) }));
  for (let y = 0; y < LH; y++) {
    let slip = 0;
    for (const band of slips) if (y >= band.from && y < band.from + band.size) slip = band.by;
    for (let x = 0; x < LW; x++) {
      const i = y * LW + x;
      const n = (i + boil) % COUNT;
      const sx = Math.min(LW - 1, Math.max(0, x + jitterX[n] + slip));
      const sy = Math.min(LH - 1, Math.max(0, y + jitterY[n]));
      const from = (sy * LW + sx) * 4;
      const d = (i + drift) % COUNT;
      const ink = holes[n] && blotch[d] < 0.5 ? 0.12 : (0.5 + 0.5 * Math.min(1, Math.max(0, (blotch[d] - 0.22) * 3.2))) * grainMap[n];
      out[i * 4] = src[from] * ink;
      out[i * 4 + 1] = src[from + 1] * ink;
      out[i * 4 + 2] = src[from + 2] * ink;
    }
  }
  lctx.putImageData(image, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;

  // Toner streaks, hairs and dust on the glass, redrawn every frame.
  for (let k = 0; k < 5; k++) {
    ctx.fillStyle = `rgba(0,0,0,${0.12 + rand(frame, 100 + k) * 0.25})`;
    ctx.fillRect(rand(Math.floor(frame / 5), 110 + k) * W, 0, 2 + rand(frame, 120 + k) * 9, H);
  }
  ctx.strokeStyle = "rgba(255,255,255,0.55)";
  ctx.lineWidth = 1.2;
  for (let k = 0; k < 4; k++) {
    const x = rand(frame, 130 + k) * W, y = rand(frame, 140 + k) * H, a = rand(frame, 150 + k) * 6.28, l = 14 + rand(frame, 160 + k) * 46;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + 9, y + Math.sin(a) * l * 0.5 - 9, x + Math.cos(a) * l, y + Math.sin(a) * l);
    ctx.stroke();
  }
  for (let k = 0; k < 70; k++) {
    ctx.fillStyle = `rgba(255,255,255,${0.15 + rand(frame, 200 + k) * 0.5})`;
    const size = 1 + rand(frame, 300 + k) * 3;
    ctx.fillRect(rand(frame, 400 + k) * W, rand(frame, 500 + k) * H, size, size);
  }
}

// --- The loop: what happens on each of the 64 frames ---------------------------

function draw(frame) {
  const f = ((frame % LOOP) + LOOP) % LOOP;
  held = [];
  ctx.fillStyle = "#070707";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(dust, (rand(frame, 1) - 0.5) * 6, (rand(frame, 2) - 0.5) * 6);
  const blockHeight = 300 * setText.fit * LEADING * lines.length;

  if (f < 3) {
    stack(0.03, frame);
  } else if (f < 8) {
    stack(0.16, frame);
    if (f < 6) DOODLES.sparks(frame, blockHeight * 0.16 * 0.62);
  } else if (f < 13) {
    stack(0.21, frame);
  } else if (f < 18) {
    stack(0.34, frame);
    if (f > 14) DOODLES.squiggle(frame, W * 0.47, H * 0.5 + blockHeight * 0.19, 90, 16);
  } else if (f < 28) {
    stack(f < 23 ? 0.44 : 0.4, frame);
  } else if (f < 32) {
    stack(1, frame);
    DOODLES.squiggle(frame, 20, H * 0.5 - 20, W - 60, 46);
    DOODLES.squiggle(frame + 9, W * 0.3, H * 0.5 + blockHeight * 0.4, 260, 30);
  } else if (f < 36) {
    stack(1.04, frame);
  } else if (f < 56) {
    const slide = (f - 36) / 20;
    bands(1.22, frame, slide * slide * (3 - 2 * slide) * 1.4);
    if (f % 6 < 3) {
      DOODLES.arrow(frame, W * 0.42, H * 0.5 - blockHeight * 0.32, 0, 70);
      DOODLES.arrow(frame, W * 0.7, H * 0.5, Math.PI, 70);
      DOODLES.arrow(frame, W * 0.46, H * 0.5 + blockHeight * 0.36, 0, 70);
    }
  } else if (f < 60) {
    const k = (f - 56) / 4;
    const w = W * (1 - k * 0.1), h = blockHeight * 1.22;
    bands(1.22 - k * 0.2, frame, 1.4, { x: (W - w) / 2, y: (H - h) / 2 + k * 30, w, h: h * (1 - k * 0.1) });
    DOODLES.arrow(frame, 30, H * 0.5 - blockHeight * 0.66, 0.75, 46);
  } else if (f < 63) {
    const w = W * 0.3, h = blockHeight * 0.3;
    bands(0.3, frame, 1.4, { x: (W - w) / 2, y: H / 2 - h / 2, w, h });
    DOODLES.arrow(frame, W / 2 + w / 2 + 44, H / 2 + h / 2 + 44, -2.35, 40);
  }
  const marks = held;
  held = null;
  if (!clean) grime(frame);
  marks.forEach(stroke);
}

// --- Playback ------------------------------------------------------------------

const clean = new URLSearchParams(location.search).has("clean");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const state = { paused: reduced || query.has("frame"), clock: query.has("frame") ? (Number(query.get("frame")) || 0) / FPS : reduced ? 30 / FPS : 0, last: 0, drawn: -1 };

function frame(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000 || 0);
  state.last = now;
  if (!state.paused) state.clock += dt;
  const index = Math.floor(state.clock * FPS + 0.001);
  if (index !== state.drawn) {
    state.drawn = index;
    draw(index);
  }
  requestAnimationFrame(frame);
}

const pause = document.getElementById("pause");
pause.setAttribute("aria-pressed", String(state.paused));
pause.addEventListener("click", () => {
  state.paused = !state.paused;
  pause.setAttribute("aria-pressed", String(state.paused));
});
input.addEventListener("input", () => { setText(input.value); state.drawn = -1; });
document.getElementById("controls").addEventListener("submit", (e) => e.preventDefault());

if (query.get("text")) input.value = query.get("text").slice(0, 30);
document.fonts.load(FONT, "A").catch(() => {}).finally(() => {
  setText(input.value);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
