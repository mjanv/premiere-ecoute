<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Image decompose</title>
<style>
  @font-face {
    font-family: "Bricolage Demo";
    font-weight: 200 800;
    src: url(/fonts/BricolageGrotesque/BricolageGrotesque-700.woff2) format("woff2");
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #141414; color: #fff; font-family: "Bricolage Demo", system-ui, sans-serif; }
  body { display: grid; grid-template-rows: auto 1fr; justify-items: center; min-height: 100dvh; }
  form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 16px 16px 0; }
  .group { display: flex; gap: 6px; }
  button, label.file { padding: 10px 14px; border-radius: 999px; border: 1px solid #ffffff40; background: none; color: #ffffffc0; font: 600 12px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  button[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }
  button:focus-visible, label.file:focus-within, input[type="range"]:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  label.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  label.range { display: flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #ffffffa0; }
  input[type="range"] { width: 130px; accent-color: #2f5cf5; }
  canvas { align-self: center; margin: 20px 16px 28px; height: min(calc(100dvh - 150px), calc((100vw - 32px) * 1.25)); aspect-ratio: 4 / 5; display: block; }
</style>
</head>
<body>
  <form id="controls">
    <div class="group" id="modes" role="group" aria-label="Decomposition"></div>
    <label class="range">Amount <input id="amount" type="range" min="0" max="1" step="0.01" value="0.6"></label>
    <button type="button" id="auto" aria-pressed="true">Auto</button>
    <label class="file">Your image<input id="image" type="file" accept="image/*"></label>
  </form>
  <canvas id="poster" width="800" height="1000" role="img" aria-label="A black and white picture taken apart into strips, squares or tiles, with blue elements laid over it."></canvas>

<script>
const W = 800, H = 1000;
const PAPER = "#f1f0ee", INK = "#141414", BLUE = "#2f5cf5";
const SANS = '"Bricolage Demo", "Helvetica Neue", Arial, sans-serif';
const HAND = '"Segoe Script", "Bradley Hand", "Snell Roundhand", "Comic Sans MS", cursive';

const canvas = document.getElementById("poster");
const ctx = canvas.getContext("2d");
const source = document.createElement("canvas");
source.width = W;
source.height = H;
const sx = source.getContext("2d", { willReadFrequently: true });
const tiny = document.createElement("canvas");
const tx = tiny.getContext("2d");

function rand(a, b = 0) {
  const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453;
  return s - Math.floor(s);
}
const ease = (x) => x * x * (3 - 2 * x);
const clamp = (x) => Math.max(0, Math.min(1, x));

// --- Source picture ------------------------------------------------------------

// Whatever is on the source canvas becomes a contrasty black and white print.
function develop() {
  const image = sx.getImageData(0, 0, W, H);
  const px = image.data;
  for (let i = 0; i < px.length; i += 4) {
    let v = (px[i] * 0.3 + px[i + 1] * 0.59 + px[i + 2] * 0.11) / 255;
    v = clamp((v - 0.5) * 1.35 + 0.5) + (Math.random() - 0.5) * 0.07;
    px[i] = px[i + 1] = px[i + 2] = clamp(v) * 255;
  }
  sx.putImageData(image, 0, 0);
}

// Placeholder: an abstract record-cover picture with large clear shapes.
function placeholder() {
  const sky = sx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#d9d9d9");
  sky.addColorStop(0.62, "#f2f2f2");
  sky.addColorStop(0.62, "#3a3a3a");
  sky.addColorStop(1, "#0d0d0d");
  sx.fillStyle = sky;
  sx.fillRect(0, 0, W, H);
  const cx = 430, cy = 450, r = 300;
  for (let i = 9; i >= 1; i--) {
    sx.strokeStyle = i % 2 ? "#111" : "#bdbdbd";
    sx.lineWidth = 16;
    sx.beginPath();
    sx.arc(cx, cy, r + i * 34, Math.PI * 0.95, Math.PI * 1.9);
    sx.stroke();
  }
  const ball = sx.createRadialGradient(cx - 110, cy - 130, 20, cx, cy, r);
  ball.addColorStop(0, "#ffffff");
  ball.addColorStop(0.45, "#b5b5b5");
  ball.addColorStop(0.85, "#2e2e2e");
  ball.addColorStop(1, "#080808");
  sx.fillStyle = ball;
  sx.beginPath();
  sx.arc(cx, cy, r, 0, Math.PI * 2);
  sx.fill();
  sx.fillStyle = "#0a0a0a";
  sx.beginPath();
  sx.arc(cx + 40, cy + 30, 86, 0, Math.PI * 2);
  sx.fill();
  sx.fillStyle = "#ededed";
  sx.beginPath();
  sx.arc(cx + 40, cy + 30, 20, 0, Math.PI * 2);
  sx.fill();
  for (let i = 0; i < 14; i++) {
    sx.fillStyle = `rgba(255,255,255,${0.05 + i * 0.012})`;
    sx.fillRect(0, 640 + i * i * 1.9, W, 2 + i * 0.6);
  }
  develop();
}

function load(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const image = new Image();
    image.onload = () => {
      const scale = Math.max(W / image.naturalWidth, H / image.naturalHeight);
      const w = image.naturalWidth * scale, h = image.naturalHeight * scale;
      sx.drawImage(image, (W - w) / 2, (H - h) / 2, w, h);
      develop();
    };
    image.src = reader.result;
  };
  reader.readAsDataURL(file);
}

// --- Over-elements shared by every mode ------------------------------------------

function labels() {
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = BLUE;
  ctx.fillRect(40, 40, 232, 44);
  ctx.fillStyle = "#fff";
  ctx.font = `800 17px ${SANS}`;
  ctx.fillText("PREMIERE ECOUTE", 56, 63);
  ctx.fillStyle = BLUE;
  ctx.fillRect(W - 396, H - 96, 356, 56);
  ctx.fillStyle = "#fff";
  ctx.font = `500 15px ${SANS}`;
  ctx.fillText("Wrapped 2026. Your year in music,", W - 380, H - 78);
  ctx.fillText("rated one vote at a time.", W - 380, H - 58);
}

// --- Decompositions: each draws the picture taken apart by amount a (0..1) ----------

const MODES = {
  // Horizontal strips slide sideways; blue bars mark some of the cuts.
  Slices(a, t) {
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, H);
    let y = 0, i = 0;
    while (y < H) {
      const h = 14 + Math.floor(rand(i, 1) * 46);
      const reach = (rand(i, 2) - 0.5) * 2;
      const dx = a * (reach * 300 + Math.sin(t * 0.9 + i * 1.7) * 24);
      ctx.drawImage(source, 0, y, W, h, dx, y, W, h);
      if (rand(i, 3) < 0.3 && a > 0.02) {
        const bar = 8 + rand(i, 4) * 10;
        const from = dx > 0 ? 0 : W + dx - 40;
        const length = Math.abs(dx) + 40 + rand(i, 5) * 220 * a;
        ctx.fillStyle = BLUE;
        ctx.globalAlpha = clamp(a * 4);
        ctx.fillRect(dx > 0 ? from : W - length, y + h - bar, length, bar);
        ctx.globalAlpha = 1;
      }
      y += h;
      i++;
    }
  },

  // A staggered grid of blue squares grows over the picture.
  Squares(a, t) {
    ctx.drawImage(source, 0, 0);
    const cell = 80, cols = W / cell, rows = H / cell;
    ctx.fillStyle = BLUE;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        if ((i + j) % 2 || rand(i, j) > 0.82) continue;
        const order = (i + j) / (cols + rows) * 0.6 + rand(i + 9, j) * 0.4;
        const grow = ease(clamp((a * 1.5 - order) * 3));
        if (grow <= 0) continue;
        const size = cell * 0.5 * grow * (1 + 0.06 * Math.sin(t * 2 + i * 1.3 + j));
        ctx.fillRect((i + 0.5) * cell - size / 2, (j + 0.5) * cell - size / 2, size, size);
      }
    }
  },

  // The picture breaks into tiles: some zoom into a detail, others turn into
  // blue notes.
  Tiles(a, t) {
    ctx.fillStyle = INK;
    ctx.fillRect(0, 0, W, H);
    const cols = 4, rows = 5, cw = W / cols, ch = H / rows;
    const gap = 7 * ease(a);
    const notes = ["128 albums", "5412 minutes", "one vote at a time", "heard together", "your year in music", "rated with the chat"];
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = i * cw + gap / 2, y = j * ch + gap / 2, w = cw - gap, h = ch - gap;
        const k = rand(i + 3, j + 5);
        const start = rand(i + 11, j + 2) * 0.5;
        const p = ease(clamp((a - start) * 2.4));
        // Every tile first shows its own piece of the picture, zooming as it goes.
        const zoom = 1 + p * (0.5 + k * 1.6) * (k < 0.7 ? 1 : 0.3);
        const fx = (rand(i, j + 20) - 0.5) * cw * 0.9 * p, fy = (rand(i + 20, j) - 0.5) * ch * 0.9 * p;
        const sw = cw / zoom, sh = ch / zoom;
        const sxx = Math.max(0, Math.min(W - sw, i * cw + (cw - sw) / 2 + fx));
        const syy = Math.max(0, Math.min(H - sh, j * ch + (ch - sh) / 2 + fy));
        ctx.drawImage(source, sxx, syy, sw, sh, x, y, w, h);
        if (k >= 0.7 && p > 0) {
          // A blue note wipes down over the tile.
          const cover = h * p;
          ctx.fillStyle = BLUE;
          ctx.fillRect(x, y, w, cover);
          if (p > 0.75) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(x, y, w, cover);
            ctx.clip();
            ctx.globalAlpha = (p - 0.75) * 4;
            ctx.fillStyle = "#fff";
            ctx.font = `italic 400 21px ${HAND}`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const words = notes[Math.floor(k * 97) % notes.length].split(" ");
            const lines = words.length > 2 ? [words.slice(0, 2).join(" "), words.slice(2).join(" ")] : [words.join(" ")];
            lines.forEach((line, n) => ctx.fillText(line, x + w / 2, y + h / 2 + (n - (lines.length - 1) / 2) * 28, w - 20));
            ctx.restore();
          }
        }
      }
    }
  },

  // Tiles coarsen into big pixels at different rates, like a woven print.
  Mosaic(a, t) {
    const cols = 8, rows = 10, cw = W / cols, ch = H / rows;
    ctx.imageSmoothingEnabled = false;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const k = rand(i + 1, j + 7);
        const pulse = 0.75 + 0.25 * Math.sin(t * 1.4 + k * 20);
        const block = 1 + Math.floor(a * a * (4 + k * 46) * pulse);
        const x = i * cw, y = j * ch;
        if (block <= 1) {
          ctx.drawImage(source, x, y, cw, ch, x, y, cw, ch);
        } else {
          const tw = Math.max(1, Math.round(cw / block)), th = Math.max(1, Math.round(ch / block));
          tiny.width = tw;
          tiny.height = th;
          tx.imageSmoothingEnabled = true;
          tx.drawImage(source, x, y, cw, ch, 0, 0, tw, th);
          ctx.drawImage(tiny, 0, 0, tw, th, x, y, cw, ch);
        }
        if ((i + j) % 2) {
          ctx.fillStyle = `rgba(255,255,255,${0.1 * a})`;
          ctx.fillRect(x, y, cw, ch);
        }
        if (k > 0.9 && a > 0.3) {
          ctx.fillStyle = BLUE;
          ctx.globalAlpha = clamp((a - 0.3) * 3);
          ctx.fillRect(x, y, cw, ch);
          ctx.globalAlpha = 1;
        }
      }
    }
    ctx.imageSmoothingEnabled = true;
  },
};

// --- Playback ------------------------------------------------------------------

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const slider = document.getElementById("amount");
const state = {
  mode: MODES[query.get("mode")] ? query.get("mode") : "Slices",
  auto: !reduced && !query.has("amount"),
  clock: 0,
  last: 0,
};
if (query.has("amount")) slider.value = String(clamp(Number(query.get("amount")) || 0));

function frame(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000 || 0);
  state.last = now;
  if (state.auto) {
    state.clock += dt;
    slider.value = String(0.5 - 0.5 * Math.cos(state.clock * 0.8));
  }
  const a = Number(slider.value);
  ctx.globalAlpha = 1;
  MODES[state.mode](a, state.auto ? state.clock : 0);
  labels();
  requestAnimationFrame(frame);
}

const modes = document.getElementById("modes");
for (const name of Object.keys(MODES)) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = name;
  b.setAttribute("aria-pressed", String(name === state.mode));
  b.addEventListener("click", () => {
    state.mode = name;
    for (const other of modes.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === b));
  });
  modes.append(b);
}
const auto = document.getElementById("auto");
const setAuto = (on) => {
  state.auto = on;
  auto.setAttribute("aria-pressed", String(on));
};
setAuto(state.auto);
auto.addEventListener("click", () => setAuto(!state.auto));
slider.addEventListener("input", () => setAuto(false));
document.getElementById("image").addEventListener("change", (e) => {
  if (e.target.files[0]) load(e.target.files[0]);
});
document.getElementById("controls").addEventListener("submit", (e) => e.preventDefault());

placeholder();
document.fonts.load(`800 20px ${SANS}`, "A").catch(() => {}).finally(() => requestAnimationFrame(frame));
</script>
</body>
</html>
