<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Light veils</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0c060b; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  form { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; padding: 16px; pointer-events: none; }
  button { pointer-events: auto; padding: 10px 14px; border-radius: 999px; border: 1px solid #ffffff40; background: #00000060; color: #ffffffc0; font: 600 12px/1 inherit; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; }
  button[aria-pressed="true"] { background: #fff; color: #000; border-color: #fff; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #ffffffb0; }
</style>
</head>
<body>
  <canvas id="gl" role="img" aria-label="Soft veils of lavender and pink light folding slowly over a dark plum background."></canvas>
  <form id="controls">
    <div id="palettes" role="group" aria-label="Palette" style="display: flex; gap: 8px; pointer-events: auto"></div>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
  </form>

<script>
const PALETTES = {
  Plum: { dark: "#0d060c", haze: "#8a2f3c", glow: "#b08cf0", hot: "#fff0fb" },
  Sea: { dark: "#04090d", haze: "#0f5a6a", glow: "#66e0d0", hot: "#f0fffb" },
  Ember: { dark: "#0d0704", haze: "#8a2a10", glow: "#ffa552", hot: "#fff6e6" },
};

const VERT = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

// Sheets of light that fold over themselves. A smooth, slowly bending field
// is cut into repeating bands; each band is brightest at its leading edge and
// trails off behind it, which gives a crisp fold with a long soft glow and a
// dark pocket in front. The field is read three times at slightly shifted
// positions, one per colour channel, so the edges pick up coloured fringes.
const FRAG = `#version 300 es
precision highp float;
out vec4 outColor;
uniform vec2 uRes;
uniform float uTime;
uniform vec2 uPointer;
uniform vec3 uDark;
uniform vec3 uHaze;
uniform vec3 uGlow;
uniform vec3 uHot;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float soft(vec2 p) { return noise(p) * 0.68 + noise(p * 1.93 + 5.1) * 0.32; }

float sheet(float f, float bands, float shift) {
  float a = fract(f * bands + shift);
  return exp(-a * 8.5) * smoothstep(0.0, 0.14, a) * 1.55 + exp(-(1.0 - a) * 30.0) * 0.12;
}

float veils(vec2 p, float t) {
  vec2 q = p + uPointer * 0.25;
  q += 0.75 * (vec2(soft(p * 0.55 + vec2(t * 0.05, 0.0)), soft(p * 0.55 + vec2(4.0, -t * 0.04))) - 0.5);
  q += 0.32 * (vec2(soft(q * 1.2 + vec2(9.0, t * 0.035)), soft(q * 1.2 + vec2(2.0 - t * 0.03, 6.0))) - 0.5);
  float f = soft(q * 0.62 + vec2(t * 0.02, 1.0));
  float g = soft(q * 0.5 + vec2(13.0, -t * 0.025));
  float light = sheet(f, 2.6, t * 0.03) * 0.95 + sheet(g, 1.9, 0.4 - t * 0.02) * 0.6;
  // Large dim areas, so the veils come and go across the frame.
  return light * smoothstep(0.3, 0.8, soft(p * 0.45 + vec2(-t * 0.03, 20.0)) + 0.14);
}

vec3 tone(float v) {
  vec3 c = mix(uDark, uHaze, smoothstep(0.04, 0.5, v) * 0.85);
  c = mix(c, uGlow, smoothstep(0.25, 0.8, v));
  return mix(c, uHot, smoothstep(0.7, 1.15, v));
}

void main() {
  float scale = min(uRes.x, uRes.y);
  vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / scale * 1.5;
  float t = uTime;
  vec2 fringe = vec2(0.016, 0.009);
  float r = veils(p - fringe, t), g = veils(p, t), b = veils(p + fringe, t);
  vec3 col = vec3(tone(r).r, tone(g).g, tone(b).b);

  // A fine printed dot screen and a little grain.
  vec2 cell = gl_FragCoord.xy / max(2.0, scale / 300.0);
  float screen = 0.5 + 0.5 * sin(cell.x * 3.14159) * sin(cell.y * 3.14159);
  col *= 0.95 + 0.1 * screen;
  col += (hash(gl_FragCoord.xy + t) - 0.5) * 0.035;
  outColor = vec4(col, 1.0);
}`;

const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl2", { antialias: false, alpha: false });
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const query = new URLSearchParams(location.search);
const state = {
  palette: PALETTES[query.get("palette")] ? query.get("palette") : "Plum",
  paused: reduced,
  frozen: query.has("time") ? Number(query.get("time")) : null,
  clock: 8,
  last: 0,
  pointer: [0, 0],
  target: [0, 0],
};
let uniforms = {};

function fail(message) {
  const p = document.createElement("p");
  p.className = "error";
  p.textContent = message;
  document.body.replaceChildren(p);
}

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

function rgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
}

function setup() {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, VERT));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  gl.useProgram(program);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "position");
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
  for (const name of ["uRes", "uTime", "uPointer", "uDark", "uHaze", "uGlow", "uHot"]) uniforms[name] = gl.getUniformLocation(program, name);
}

function frame(now) {
  const dt = Math.min(0.05, (now - state.last) / 1000 || 0);
  state.last = now;
  if (!gl.isContextLost()) {
    if (!state.paused) state.clock += dt;
    for (const i of [0, 1]) state.pointer[i] += (state.target[i] - state.pointer[i]) * Math.min(1, dt * 1.5);
    const ratio = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(2, Math.round(canvas.clientWidth * ratio));
    const h = Math.max(2, Math.round(canvas.clientHeight * ratio));
    if (w !== canvas.width || h !== canvas.height) {
      canvas.width = w;
      canvas.height = h;
      gl.viewport(0, 0, w, h);
    }
    const colors = PALETTES[state.palette];
    gl.uniform2f(uniforms.uRes, w, h);
    gl.uniform1f(uniforms.uTime, state.frozen ?? state.clock);
    gl.uniform2f(uniforms.uPointer, state.pointer[0], state.pointer[1]);
    gl.uniform3fv(uniforms.uDark, rgb(colors.dark));
    gl.uniform3fv(uniforms.uHaze, rgb(colors.haze));
    gl.uniform3fv(uniforms.uGlow, rgb(colors.glow));
    gl.uniform3fv(uniforms.uHot, rgb(colors.hot));
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(frame);
}

function start() {
  if (!gl) return fail("WebGL 2 is not available in this browser.");
  canvas.addEventListener("webglcontextlost", (e) => e.preventDefault());
  canvas.addEventListener("webglcontextrestored", () => setup());
  try {
    setup();
  } catch (error) {
    if (!gl.isContextLost()) return fail(String(error.message || error));
  }
  canvas.addEventListener("pointermove", (e) => {
    state.target = [(e.clientX / window.innerWidth - 0.5) * 2, (0.5 - e.clientY / window.innerHeight) * 2];
  });
  const palettes = document.getElementById("palettes");
  for (const name of Object.keys(PALETTES)) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = name;
    b.setAttribute("aria-pressed", String(name === state.palette));
    b.addEventListener("click", () => {
      state.palette = name;
      for (const other of palettes.querySelectorAll("button")) other.setAttribute("aria-pressed", String(other === b));
    });
    palettes.append(b);
  }
  const pause = document.getElementById("pause");
  pause.setAttribute("aria-pressed", String(state.paused));
  pause.addEventListener("click", () => {
    state.paused = !state.paused;
    pause.setAttribute("aria-pressed", String(state.paused));
  });
  document.getElementById("controls").addEventListener("submit", (e) => e.preventDefault());
  requestAnimationFrame(frame);
}

start();
</script>
</body>
</html>
