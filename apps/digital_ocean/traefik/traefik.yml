api:
  dashboard: true
  insecure: true

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    # Directory, not a single file: other apps on this droplet drop their own
    # routing in here (e.g. cinema.yml) and are deployed independently. Traefik
    # merges every *.yml into one config, so neither deploy can clobber the other.
    directory: /opt/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: maxime.janvier+premiereecoute@gmail.com
      storage: /opt/traefik/acme.json
      tlsChallenge: {}

log:
  level: INFO
