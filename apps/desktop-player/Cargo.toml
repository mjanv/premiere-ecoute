[package]
name = "premiere-ecoute-player"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = "0.7.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
base64 = "0.23"
getrandom = "0.4"
url = "2"
fastrand = "2"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Threading",
]

[target.'cfg(windows)'.dependencies]
# The `implement` macro refers to this crate by name.
windows-core = "0.62"

[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }

# Smaller, faster exe for distribution. Never `panic = "abort"`: the supervisors catch panics.
[features]
# Dev builds talk to a local backend (http://localhost:4000); without it the server is https://premiere-ecoute.fr.
dev-server = []

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[lints.clippy]
undocumented_unsafe_blocks = "warn"
