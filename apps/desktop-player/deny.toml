# Checked with: cargo deny --target x86_64-pc-windows-msvc check (see docs/quality.md)

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Each entry: the crate is reached only through GPUI. Drop the entry once GPUI moves off it.
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained, transitive through GPUI" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, transitive through GPUI" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, transitive through GPUI" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, transitive through GPUI" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# This crate has `publish = false` and no license of its own.
ignore = true

[bans]
# GPUI pulls two versions of many crates; not ours to fix.
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
